[mod]
id = "mjolnir"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mjolnir"
source = "runtime.rs"

# A player's hit lands on a mob while holding the hammer.
[[injection]]
id = "hit-strike"
hook = "hurt_enemy"
hook_version = 1
kind = "HEAD"
helper = "hit.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "entity", ty = "u32", value = "entity" },
]

# Right click with the hammer: Thor's wrath.
[[injection]]
id = "wrath"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "use.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# Applies the queued bolts, sounds and particles once per tick.
[[injection]]
id = "tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "&horizon_client::mod_api::ServerTickPhase", value = "&phase" },
]

# Client effects: camera shake, screen flash and a blue light where each bolt lands.
[[injection]]
id = "camera-shake"
hook = "camera_shake"
hook_version = 1
kind = "HEAD"
helper = "shake.rs"
bindings = [
  { name = "shake", ty = "&mut NativeShake", value = "shake" },
]

[[injection]]
id = "flash"
hook = "gui_render_post"
hook_version = 1
kind = "HEAD"
helper = "flash.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut HudBatch", value = "batch" },
]

[[injection]]
id = "glow"
hook = "visuals"
hook_version = 1
kind = "HEAD"
helper = "glow.rs"
bindings = [
  { name = "lights", ty = "&mut Vec<NativeColoredLight>", value = "lights" },
]

# Cinematic: slow push-in on the field of view.
[[injection]]
id = "fov-push"
hook = "compute_fov_modifier"
hook_version = 1
kind = "HEAD"
helper = "fov.rs"
bindings = [
  { name = "modifier", ty = "&mut f32", value = "modifier" },
]

# Cinematic: the camera swings around the player.
[[injection]]
id = "camera-orbit"
hook = "camera_pose"
hook_version = 1
kind = "HEAD"
helper = "orbit.rs"
bindings = [
  { name = "position", ty = "&mut [f64; 3]", value = "position" },
  { name = "yaw", ty = "&mut f32", value = "yaw" },
  { name = "pitch", ty = "&mut f32", value = "pitch" },
]

# The first-person hand hides while the camera orbits.
[[injection]]
id = "hide-hand"
hook = "render_hand"
hook_version = 1
kind = "HEAD"
helper = "hand.rs"
bindings = [
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]

# Lightning arcs from the hammer to its targets. Not in the hook catalog yet, so it names its target
# and relies on the pinned Horizon revision.
[[injection]]
id = "arc-lines"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_primitives"
kind = "HEAD"
helper = "arcs.rs"
bindings = [
  { name = "primitives", ty = "&mut WorldPrimitives", value = "primitives" },
]

# Values for the mjolnir_storm shader pack.
[[injection]]
id = "storm-values"
hook = "shader_params"
hook_version = 1
kind = "HEAD"
helper = "shader.rs"
bindings = [
  { name = "params", ty = "&mut [[f32; 4]; 8]", value = "params" },
]
