[mod]
id = "mjolnir"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mjolnir"
source = "runtime.rs"

# A player's hit lands on a mob while holding the hammer.
[[injection]]
id = "hit-strike"
hook = "hurt_enemy"
hook_version = 1
kind = "HEAD"
helper = "hit.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "is_mjolnir", ty = "bool", value = "&*stack.item == \"mjolnir:mjolnir\"" },
  { name = "entity", ty = "u32", value = "entity" },
]

# Right click with the hammer: Thor's wrath.
[[injection]]
id = "wrath"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "use.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "is_mjolnir", ty = "bool", value = "&*stack.item == \"mjolnir:mjolnir\"" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# Applies the queued bolts, sounds and particles once per tick.
[[injection]]
id = "tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "is_end", ty = "bool", value = "matches!(phase, horizon_client::mod_api::ServerTickPhase::ServerTickEnd { .. })" },
]

# Client effects: camera shake, screen flash and a blue light where each bolt lands.
[[injection]]
id = "shake"
hook = "camera_shake"
hook_version = 1
kind = "HEAD"
helper = "shake.rs"
bindings = [
  { name = "shake", ty = "&mut NativeShake", value = "shake" },
]

[[injection]]
id = "flash"
hook = "gui_render_post"
hook_version = 1
kind = "HEAD"
helper = "flash.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut HudBatch", value = "batch" },
]

[[injection]]
id = "glow"
hook = "visuals"
hook_version = 1
kind = "HEAD"
helper = "glow.rs"
bindings = [
  { name = "lights", ty = "&mut Vec<NativeColoredLight>", value = "lights" },
]
